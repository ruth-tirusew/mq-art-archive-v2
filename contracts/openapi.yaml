components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: mq_access_token
      description: httpOnly JWT session cookie set after OAuth or email/password login.

  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: false
      description: Dev-only stub when AUTH_DEV_MODE=true (UUID).
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, role, has_password, email_verified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [public, artist, institution, contributor, admin]
        display_name:
          type: string
        avatar_url:
          type: string
        has_password:
          type: boolean
        email_verified:
          type: boolean

    NotificationPreferences:
      type: object
      required: [email_on_new_application, email_on_event_sync_summary, newsletter_enabled]
      properties:
        email_on_new_application: { type: boolean }
        email_on_event_sync_summary: { type: boolean }
        newsletter_enabled: { type: boolean }

    ScrapeSettings:
      type: object
      required:
        - scrape_enabled
        - scrape_sources
        - scrape_user_agent
        - scrape_timeout_seconds
        - scrape_interval_seconds
        - telegram_enabled
        - telegram_api_id
        - telegram_api_hash_set
        - telegram_channels
        - telegram_keywords
        - telegram_fetch_limit
        - session_authorized
      properties:
        scrape_enabled: { type: boolean }
        scrape_sources:
          type: array
          items: { type: string }
        scrape_user_agent: { type: string }
        scrape_timeout_seconds: { type: integer }
        scrape_interval_seconds: { type: integer }
        telegram_enabled: { type: boolean }
        telegram_api_id: { type: integer }
        telegram_api_hash_set: { type: boolean }
        telegram_channels:
          type: array
          items: { type: string }
        telegram_keywords:
          type: array
          items: { type: string }
        telegram_fetch_limit: { type: integer }
        session_authorized: { type: boolean }

    ScrapeSettingsUpdate:
      type: object
      properties:
        scrape_enabled: { type: boolean }
        scrape_sources:
          type: array
          items: { type: string }
        scrape_user_agent: { type: string }
        scrape_timeout_seconds: { type: integer }
        scrape_interval_seconds: { type: integer }
        telegram_enabled: { type: boolean }
        telegram_api_id: { type: integer }
        telegram_api_hash:
          type: string
          description: Leave blank to keep the existing hash unchanged
        telegram_channels:
          type: array
          items: { type: string }
        telegram_keywords:
          type: array
          items: { type: string }
        telegram_fetch_limit: { type: integer }

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    Article:
      type: object
      required: [id, slug, title, body, author_id, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
