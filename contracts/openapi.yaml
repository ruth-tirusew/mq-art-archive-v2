      tags: [content]
      summary: Delete the caller's own highlight
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "204": {description: Deleted}
        "404": {description: Not found, or not owned by the caller}
  /api/v1/wiki/articles/{articleId}/comments:
    get:
      tags: [content]
      summary: List an article's comments — anchored margin comments and general responses (public)
      parameters: [{name: articleId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Comments, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Comment"}}}}}
    post:
      tags: [content]
      summary: Post a comment on an article — anchored to a span, or a general response
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{name: articleId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string}
                is_general: {type: boolean}
                quoted_text: {type: string, description: Required when is_general is false}
                start: {type: integer}
                end: {type: integer}
      responses:
        "201": {description: Created comment, content: {application/json: {schema: {$ref: "#/components/schemas/Comment"}}}}
        "400": {description: Empty body, or (for an anchored comment) a span that doesn't describe real, in-bounds text}
        "404": {description: Article not found}
  /api/v1/wiki/comments/{id}:
    delete:
      tags: [content]
      summary: Delete the caller's own comment
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "204": {description: Deleted}
        "404": {description: Not found, or not owned by the caller}
  /admin/v1/wiki/submissions:
    get:
      tags: [content]
      summary: List pending wiki submissions
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Pending submissions, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/WikiSubmission"}}}}}
  /admin/v1/wiki/submissions/{id}:
    get:
      tags: [content]
      summary: Get a submission and its target article's current content, for a diff (admin)
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Submission with target article, content: {application/json: {schema: {$ref: "#/components/schemas/WikiSubmissionReview"}}}}
  /admin/v1/wiki/submissions/{id}/approve:
    post:
      tags: [content]
      summary: Approve a wiki submission and publish its article revision
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Approved submission}
  /admin/v1/wiki/submissions/{id}/reject:
    post:
      tags: [content]
      summary: Reject a wiki submission
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Rejected submission}

  /api/v1/analytics/view:
    post:
      tags: [analytics]
      summary: Record a deduplicated, cookied page view
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PageViewInput"}}}}
      responses:
        "202": {description: View accepted}
        "429": {description: Rate limited}
  /api/v1/me/analytics:
    get:
      tags: [analytics]
      summary: Query studio page-view counts
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200": {description: Daily counts}
  /admin/v1/analytics:
    get:
      tags: [analytics]
      summary: Query page-view counts
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: entity_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: entity_type, in: query, required: false, schema: {type: string, enum: [artist, post, article]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Daily counts}

  /admin/v1/users:
    get:
      tags: [auth]
      summary: List users
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: role, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/User"}}

  /admin/v1/users/{id}:
    patch:
      tags: [auth]
      summary: Update a user role
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [public, artist, institution, contributor, admin]}
      responses:
        "200":
          description: Updated user
          content: {application/json: {schema: {$ref: "#/components/schemas/User"}}}

  /api/v1/me/questionnaire:
    get:
      tags: [questionnaire]
      summary: Get the questionnaire form and my answers so far
      operationId: getMyQuestionnaire
      description: |
        Latest published revision plus the caller's answers. Available to any signed-in user (applicants answer before approval).
        404 until the first revision is published; clients then fall back to the plain application form.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireForm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/me/questionnaire/answers:
    put:
      tags: [questionnaire]
      summary: Autosave answers
      operationId: saveMyQuestionnaireAnswers
      description: |
        Saves a partial form; required questions are only enforced when submitting an application.
        Rich answers (`format: rich`, long_text only) are sanitised server-side to a small HTML allowlist.
        All answers in the request are saved or none are. 409 while an application is under review.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAnswersRequest"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/me/questionnaire/nudge:
    get:
      tags: [questionnaire]
      summary: Get my pending nudge
      operationId: getMyQuestionnaireNudge
      description: |
        An optional invitation to answer questions added in a newer revision. 404 when there is none.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Nudge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireNudge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/me/questionnaire/nudges/{revisionId}/dismiss:
    post:
      tags: [questionnaire]
      summary: Dismiss a nudge
      operationId: dismissQuestionnaireNudge
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Dismissed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/artists/{slug}/answers:
    get:
      tags: [questionnaire]
      summary: List an artist's public answers
      operationId: listArtistAnswers
      description: |
        Only answers to public questions in the current revision. 404 unless the profile is public.
        `body` is sanitised HTML when `format` is `rich`, and must be rendered as text when `plain`.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAnswer"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/invites/preview:
    post:
      tags: [onboarding]
      summary: Preview an artist invite
      operationId: previewInvite
      description: |
        Public so the claim page can show who an invite is for. The token is sent in the body, never the URL. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitePreviewRequest"
      responses:
        "200":
          description: Invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/invites/register:
    post:
      tags: [onboarding]
      summary: Create an account from an artist invite
      operationId: registerFromInvite
      description: |
        Lets someone with no account join straight from their invite link. Public; rate limited like
        registration. The request carries only the invite token and a password. The account's email is
        taken from the invite on the server, never from the request (any `email` sent is ignored).

        Because the link was delivered only to that address, the account is created **already verified**
        and signed in (sets the auth cookie). The role stays `public`: the application the invitee then
        submits is still approved by an admin.

        409 if the invite was already used, revoked or has expired, or if that email already has an account
        (the invite never verifies or takes over an existing account; the person should sign in instead).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRegisterRequest"
      responses:
        "201":
          description: Account created and signed in; sets auth cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/applications/invite:
    post:
      tags: [onboarding]
      summary: Claim an invite and submit an application
      operationId: claimInvite
      description: |
        Claims the invite and submits the application in one step; the application is still reviewed by an admin.
        Requires a **verified** email that matches the invite (accounts created through `registerFromInvite` already are). The invite is only consumed if the application is accepted
        (e.g. 400 if required questions are unanswered, 409 if the invite is used, expired or revoked, 403 for the wrong or unverified email).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInviteRequest"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/applications/{id}/answers:
    get:
      tags: [onboarding]
      summary: Get an application's questionnaire answers
      operationId: getApplicationAnswers
      description: |
        Every answer, private ones included, shown against the revision the applicant answered. 404 if no questionnaire exists.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireReviewView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/invites:
    get:
      tags: [onboarding]
      summary: List artist invites
      operationId: listInvites
      description: |
        Admin only, newest first. Without `status` every invite is returned. The total number of matches
        is in the `X-Total-Count` header.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [live, claimed, revoked, expired, all]
            default: all
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Invites
          headers:
            X-Total-Count:
              description: Number of invites matching the filter, ignoring limit and offset.
              schema: {type: integer}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [onboarding]
      summary: Create an artist invite
      operationId: createInvite
      description: |
        Emails the invitee (best effort) and returns the one-time token and link, which cannot be retrieved again.
        The optional handle is reserved while the invite is live.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/invites/{id}:
    delete:
      tags: [onboarding]
      summary: Revoke an invite
      operationId: revokeInvite
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/invites/{id}/resend:
    post:
      tags: [onboarding]
      summary: Resend an invite with a new link
      operationId: resendInvite
      description: |
        Revokes the old link and issues a new one with the same details.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: New invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/questionnaire/draft:
    get:
      tags: [questionnaire]
      summary: Get the questionnaire draft
      operationId: getQuestionnaireDraft
      description: |
        Admin only. State-changing requests must be sent as `application/json` from an allowed origin (CSRF protection).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [questionnaire]
      summary: Start a draft
      operationId: startQuestionnaireDraft
      description: |
        Returns the existing draft, or creates one cloned from the latest published revision.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [questionnaire]
      summary: Save the draft
      operationId: saveQuestionnaireDraft
      description: |
        Replaces the draft's whole question list (order = position). A published key cannot change its type; use a new key.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftRequest"
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [questionnaire]
      summary: Discard the draft
      operationId: discardQuestionnaireDraft
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Discarded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/questionnaire/draft/publish:
    post:
      tags: [questionnaire]
      summary: Publish the draft as the next revision
      operationId: publishQuestionnaire
      description: |
        Validates, numbers and freezes the draft. Published revisions are immutable.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/questionnaire/revisions:
    get:
      tags: [questionnaire]
      summary: List published revisions (without questions)
      operationId: listQuestionnaireRevisions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionnaireRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/questionnaire/revisions/{id}:
    get:
      tags: [questionnaire]
      summary: Get a revision with its questions
      operationId: getQuestionnaireRevision
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /admin/v1/questionnaire/nudge:
    get:
      tags: [questionnaire]
      summary: Preview a nudge
      operationId: previewQuestionnaireNudge
      description: |
        How many approved artists have unanswered questions in the latest revision, and whether a nudge can be sent (substantive revisions only).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionnaireNudgePreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [questionnaire]
      summary: Send a nudge
      operationId: sendQuestionnaireNudge
      description: |
        Emails approved artists who have unanswered questions, once per artist per revision. Optional for artists: nothing about their profile changes.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendNudgeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: mq_access_token
      description: httpOnly JWT session cookie set after OAuth or email/password login.

  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: false
      description: Dev-only stub when AUTH_DEV_MODE=true (UUID).
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, role, has_password, email_verified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [public, artist, institution, contributor, admin]
        display_name:
          type: string
        avatar_url:
          type: string
        has_password:
          type: boolean
        email_verified:
          type: boolean

    NotificationPreferences:
      type: object
      required: [email_on_new_application, email_on_event_sync_summary, newsletter_enabled]
      properties:
        email_on_new_application: { type: boolean }
        email_on_event_sync_summary: { type: boolean }
        newsletter_enabled: { type: boolean }

    ScrapeSettings:
      type: object
      required:
        - scrape_enabled
        - scrape_sources
        - scrape_user_agent
        - scrape_timeout_seconds
        - scrape_interval_seconds
        - telegram_enabled
        - telegram_api_id
        - telegram_api_hash_set
        - telegram_channels
        - telegram_keywords
        - telegram_fetch_limit
        - session_authorized
      properties:
        scrape_enabled: { type: boolean }
        scrape_sources:
          type: array
          items: { type: string }
        scrape_user_agent: { type: string }
        scrape_timeout_seconds: { type: integer }
        scrape_interval_seconds: { type: integer }
        telegram_enabled: { type: boolean }
        telegram_api_id: { type: integer }
        telegram_api_hash_set: { type: boolean }
        telegram_channels:
          type: array
          items: { type: string }
        telegram_keywords:
          type: array
          items: { type: string }
        telegram_fetch_limit: { type: integer }
        session_authorized: { type: boolean }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }

    ScrapeSettingsUpdate:
      type: object
      properties:
        scrape_enabled: { type: boolean }
        scrape_sources:
          type: array
          items: { type: string }
        scrape_user_agent: { type: string }
        scrape_timeout_seconds: { type: integer }
        scrape_interval_seconds: { type: integer }
        telegram_enabled: { type: boolean }
        telegram_api_id: { type: integer }
        telegram_api_hash:
          type: string
          description: Leave blank to keep the existing hash unchanged
        telegram_channels:
          type: array
          items: { type: string }
        telegram_keywords:
          type: array
          items: { type: string }
        telegram_fetch_limit: { type: integer }

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    Article:
      type: object
      required: [id, slug, title, body, author_id, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        body:
          type: string
        category:
          type: string
        excerpt:
          type: string
        reading_time:
          type: integer
        difficulty:
          type: string
        verified:
          type: boolean
        contributors:
          type: integer
        author_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateArticleRequest:
      type: object
      required: [title]
