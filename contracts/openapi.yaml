        description:
          type: string
        medium:
          type: string
        residency:
          type: string
        exhibition:
          type: string
        status:
          type: string
          enum: [draft, published, archived]

    CreateArtPostRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        medium:
          type: string
        year:
          type: integer
          nullable: true
        dimensions:
          type: string
        city:
          type: string
        style:
          type: string
        residency:
          type: string
        exhibition:
          type: string
        palette:
          type: array
          items:
            type: string
        media_urls:
          type: array
          items:
            type: string

    UpdateArtPostRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        medium:
          type: string
        year:
          type: integer
          nullable: true
        dimensions:
          type: string
        city:
          type: string
        style:
          type: string
        residency:
          type: string
        exhibition:
          type: string
        palette:
          type: array
          items:
            type: string
        media_urls:
          type: array
          items:
            type: string

    OnboardingApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicant_id:
          type: string
          format: uuid
        applicant_type:
          type: string
          enum: [artist, institution]
        display_name:
          type: string
        requested_handle:
          type: string
        notes:
          type: string
          description: The applicant's own links and notes.
        review_notes:
          type: string
          description: Note from the reviewer, shown to the applicant. Required when rejecting.
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        questionnaire_revision_id:
          type: string
          format: uuid
          description: The questionnaire revision the applicant answered, if any.
        invite_id:
          type: string
          format: uuid
          description: Set when the applicant arrived through an invite.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubmitApplicationRequest:
      type: object
      required: [applicant_type, display_name]
      properties:
        applicant_type:
          type: string
          enum: [artist, institution]
        display_name:
          type: string
        requested_handle:
          type: string
          pattern: "^[a-z0-9_]{3,30}$"
        notes:
          type: string

    ReviewApplicationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        notes:
          type: string

    HandleAvailability:
      type: object
      required: [handle, available]
      properties:
        handle: {type: string}
        available: {type: boolean}
    MediaUploadSignature:
      type: object
      required: [timestamp, signature, cloud_name, api_key, folder, public_id, expire_at]
      properties:
        timestamp: {type: integer, format: int64}
        signature: {type: string}
        cloud_name: {type: string}
        api_key: {type: string}
        folder: {type: string}
        public_id: {type: string}
        expire_at: {type: string, format: date-time}
    MediaCompletion:
      type: object
      required: [public_id, secure_url, resource_type, format, width, height, bytes]
      properties:
        public_id: {type: string}
        secure_url: {type: string, format: uri}
        resource_type: {type: string, enum: [image]}
        format: {type: string, enum: [jpg, jpeg, png, webp]}
        width: {type: integer}
        height: {type: integer}
        bytes: {type: integer, maximum: 10485760}
    MediaAsset:
      type: object
      properties:
        id: {type: string, format: uuid}
        owner_user_id: {type: string, format: uuid}
        public_id: {type: string}
        secure_url: {type: string, format: uri}
        resource_type: {type: string}
        width: {type: integer, nullable: true}
        height: {type: integer, nullable: true}
        bytes: {type: integer, nullable: true}
        folder: {type: string}
    WikiSubmissionInput:
      type: object
      required: [title, body]
      properties:
        article_id: {type: string, format: uuid, nullable: true}
        title: {type: string}
        body: {type: string}
    WikiSubmission:
      type: object
      properties:
        id: {type: string, format: uuid}
        submitter_id: {type: string, format: uuid}
        article_id: {type: string, format: uuid, nullable: true}
        title: {type: string}
        body: {type: string}
        kind: {type: string, enum: [new, edit]}
        based_on_version: {type: integer, nullable: true, description: "Target article's version at submission time (edit submissions only)."}
        status: {type: string, enum: [pending, approved, rejected]}
        review_notes: {type: string}
    WikiSubmissionReview:
      type: object
      description: A submission alongside the current state of its target article, for rendering a diff. `article` is omitted for a new-article submission.
      properties:
        submission: {$ref: "#/components/schemas/WikiSubmission"}
        article: {$ref: "#/components/schemas/Article"}
    FavoriteStatus:
      type: object
      properties:
        favorited: {type: boolean}
        count: {type: integer}
    Highlight:
      type: object
      properties:
        id: {type: string, format: uuid}
        quoted_text: {type: string}
        start: {type: integer}
        end: {type: integer}
        matched: {type: boolean, description: "False if the article changed enough since this was created that the quoted text can no longer be found — start/end are then meaningless."}
        created_at: {type: string, format: date-time}
    PopularHighlight:
      type: object
      nullable: true
      description: The article's most-highlighted passage across all readers, or null if none has reached the minimum reader count to count as popular.
      properties:
        start: {type: integer}
        end: {type: integer}
        count: {type: integer, description: Number of distinct readers whose highlight covers this passage.}
    Comment:
      type: object
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        author_name: {type: string}
        body: {type: string}
        is_general: {type: boolean, description: "True for an unanchored 'response' at the bottom of the article; false for a margin comment anchored to a span."}
        quoted_text: {type: string}
        start: {type: integer}
        end: {type: integer}
        matched: {type: boolean, description: "For an anchored comment, false if the article changed enough that the quoted text can no longer be found. Always false for a general comment."}
        created_at: {type: string, format: date-time}
    ActivityHighlight:
      type: object
      description: A user's own highlight, with enough of its article's identity to link back to it — for the personal activity feed, not re-anchored against the article's current body.
      properties:
        id: {type: string, format: uuid}
        article_id: {type: string, format: uuid}
        article_slug: {type: string}
        article_title: {type: string}
        quoted_text: {type: string}
        created_at: {type: string, format: date-time}
    ActivityComment:
      type: object
      description: A user's own comment, with enough of its article's identity to link back to it — for the personal activity feed.
      properties:
        id: {type: string, format: uuid}
        article_id: {type: string, format: uuid}
        article_slug: {type: string}
        article_title: {type: string}
        body: {type: string}
        is_general: {type: boolean}
        created_at: {type: string, format: date-time}
    PageViewInput:
      type: object
      required: [entity_type, entity_id]
      properties:
        entity_type: {type: string, enum: [artist, post, article]}
        entity_id: {type: string, format: uuid}

    QuestionnaireOption:
      type: object
      required: [value, label_en]
      properties:
        value: {type: string, maxLength: 100}
        label_en: {type: string, maxLength: 200}
        label_am: {type: string, maxLength: 200}

    QuestionnaireQuestion:
      type: object
      properties:
        key:
          type: string
          pattern: "^[a-z0-9_]{1,64}$"
          description: Stable identity across revisions. Answers attach to it.
        position: {type: integer}
        type: {type: string, enum: [short_text, long_text, choice, link]}
        prompt_en: {type: string}
        prompt_am: {type: string}
        help_en: {type: string}
        help_am: {type: string}
        required: {type: boolean}
        is_public:
          type: boolean
          description: Private answers are visible to admins only.
        max_length:
          type: integer
          description: Visible characters (not bytes), so Amharic is not penalised.
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireOption"

    QuestionnaireRevision:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: integer, description: Assigned on publish.}
        status: {type: string, enum: [draft, published]}
        change_kind:
          type: string
          enum: [minor, substantive]
          description: Only substantive revisions can be nudged.
        note: {type: string}
        published_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireQuestion"

    QuestionRequest:
      type: object
      required: [key, type, prompt_en]
      properties:
        key: {type: string, maxLength: 64}
        type: {type: string, enum: [short_text, long_text, choice, link]}
        prompt_en: {type: string, maxLength: 500}
        prompt_am: {type: string, maxLength: 500}
        help_en: {type: string, maxLength: 1000}
        help_am: {type: string, maxLength: 1000}
        required: {type: boolean}
        is_public: {type: boolean}
        max_length: {type: integer, minimum: 0, maximum: 20000, description: 0 means the default for the type.}
        options:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/QuestionnaireOption"

    SaveDraftRequest:
      type: object
      required: [change_kind, questions]
      properties:
        change_kind: {type: string, enum: [minor, substantive]}
        note: {type: string, maxLength: 1000}
        expected_updated_at:
          type: string
          format: date-time
          description: >
            The draft's updated_at when the editor loaded it. If the draft has been saved by someone
            else since, the request is refused with 409 instead of overwriting their changes.
        questions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuestionRequest"

    QuestionnaireAnswer:
      type: object
      properties:
        key: {type: string}
        body:
          type: string
          description: HTML (sanitised) when format is rich; plain text otherwise.
        format: {type: string, enum: [plain, rich]}
        lang: {type: string, enum: [en, am, mixed]}
        updated_at: {type: string, format: date-time}

    SaveAnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [key]
            properties:
              key: {type: string, maxLength: 64}
              body: {type: string, maxLength: 100000, description: An empty body clears the answer.}
              format: {type: string, enum: [plain, rich], default: plain, description: rich is only valid for long_text questions.}
              lang: {type: string, enum: [en, am, mixed], default: en}

    QuestionnaireForm:
      type: object
      properties:
        revision:
          $ref: "#/components/schemas/QuestionnaireRevision"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireAnswer"
        locked:
          type: boolean
          description: True while an application is under review; answers cannot change.

    PublicAnswer:
      type: object
      properties:
        key: {type: string}
        type: {type: string}
        prompt_en: {type: string}
        prompt_am: {type: string}
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireOption"
        body: {type: string}
        format: {type: string, enum: [plain, rich]}
        lang: {type: string, enum: [en, am, mixed]}

    QuestionnaireReviewView:
      type: object
      properties:
        revision:
          $ref: "#/components/schemas/QuestionnaireRevision"
        items:
          type: array
          items:
            type: object
            properties:
              question:
                $ref: "#/components/schemas/QuestionnaireQuestion"
              answer:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/QuestionnaireAnswer"
        other:
          type: array
          description: Answers to questions that are not in this revision (added later, or since removed).
          items:
            $ref: "#/components/schemas/QuestionnaireAnswer"

    QuestionnaireNudge:
      type: object
      properties:
        revision_id: {type: string, format: uuid}
        sent_at: {type: string, format: date-time}
        questions:
          type: array
          description: Still-unanswered questions in the latest revision.
          items:
            $ref: "#/components/schemas/QuestionnaireQuestion"

    QuestionnaireNudgePreview:
      type: object
      properties:
        revision_id: {type: string, format: uuid}
        revision_number: {type: integer}
        change_kind: {type: string, enum: [minor, substantive]}
        eligible: {type: integer}
        can_send: {type: boolean}

    SendNudgeResult:
      type: object
      properties:
        sent: {type: integer, description: Artists newly nudged; 0 if everyone eligible was already nudged.}

    Invite:
      type: object
      description: Never includes the token or its hash.
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        requested_handle: {type: string}
        status: {type: string, enum: [live, claimed, revoked, expired]}
        expires_at: {type: string, format: date-time}
        claimed_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    InviteCreated:
      type: object
      description: The only response that ever contains the raw token and link. They cannot be retrieved again.
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        token: {type: string}
        link: {type: string}

    CreateInviteRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, maxLength: 254}
        display_name: {type: string, maxLength: 100}
        handle: {type: string, pattern: "^[a-z0-9_]{3,30}$"}
        ttl_days: {type: integer, minimum: 0, maximum: 60, description: 0 means the default of 14 days.}

    InvitePreviewRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, maxLength: 200}

    InvitePreview:
      type: object
      properties:
        email: {type: string}
        display_name: {type: string}
        handle: {type: string}
        status: {type: string, enum: [live, claimed, revoked, expired]}

    ClaimInviteRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, maxLength: 200}
        display_name: {type: string, maxLength: 100, description: Defaults to the invite's name.}
        requested_handle: {type: string, pattern: "^[a-z0-9_]{3,30}$", description: Defaults to the invite's reserved handle.}
        notes: {type: string, maxLength: 5000}

    InviteRegisterRequest:
      type: object
      required: [token, password]
      description: No email field on purpose. The address comes from the invite.
      properties:
        token: {type: string, maxLength: 200}
        password: {type: string, minLength: 8, maxLength: 200}
