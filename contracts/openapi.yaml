        in_residence:
          type: boolean
        residency_place:
          type: string
        open_for_commission:
          type: boolean
        contact:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
            website: { type: string }
            location: { type: string }
        social:
          type: object
          properties:
            instagram: { type: string }
            twitter: { type: string }
            telegram: { type: string }
        status:
          type: string
          enum: [draft, pending, approved]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateArtistProfileRequest:
      type: object
      properties:
        display_name: { type: string }
        slug: { type: string }
        handle: { type: string }
        bio: { type: string }
        born: { type: string }
        discipline: { type: string }
        tagline: { type: string }
        years_active: { type: string }
        portrait_url: { type: string }
        influences:
          type: array
          items:
            type: string
        in_residence: { type: boolean }
        residency_place: { type: string }
        open_for_commission: { type: boolean }
        contact:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
            website: { type: string }
            location: { type: string }
        social:
          type: object
          properties:
            instagram: { type: string }
            twitter: { type: string }
            telegram: { type: string }
        status:
          type: string
          enum: [draft, pending]

    Institution:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        contact:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
            website: { type: string }
            location: { type: string }
        status:
          type: string
          enum: [draft, pending, approved]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventSubmissionRequest:
      type: object
      required: [title, starts_at]
      properties:
        title:
          type: string
        description:
          type: string
        source_url:
          type: string
        event_type:
          type: string
        venue:
          type: string
        city:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        source_url:
          type: string
        image_url:
          type: string
          nullable: true
        event_type:
          type: string
        venue:
          type: string
        city:
          type: string
        location:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            pin_coords:
              type: array
              items:
                type: number
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        review_notes:
          type: string
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        scraped_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReviewEventRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
        notes:
          type: string

    SyncEventsResponse:
      type: object
      required: [upserted]
      properties:
        upserted:
          type: integer

    SearchResponse:
      type: object
      required: [articles, events, artists, posts]
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistProfile"
        posts:
          type: array
          items:
            $ref: "#/components/schemas/ArtPost"

    ArtPost:
      type: object
      properties:
        id:
          type: string
