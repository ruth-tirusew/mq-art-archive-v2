openapi: 3.0.3
info:
  title: mq API
  description: |
    Ethiopian artists platform API.

    Bounded contexts:
    - `content` — community wiki articles
    - `profile` — artist/institution presence
    - `art` — artwork posts
    - `onboarding` — admin vetting (admin routes)
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
  - name: content
    description: Wiki articles
  - name: profile
    description: Artist profiles
  - name: art
    description: Artwork posts
  - name: onboarding
    description: Admin vetting
  - name: events
    description: Art events
  - name: search
    description: Unified full-text search
  - name: auth
    description: OAuth login and session
  - name: settings
    description: Admin scrape and MTProto configuration
  - name: media
    description: Direct Cloudinary uploads
  - name: analytics
    description: Privacy-preserving visitor counts

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/articles:
    get:
      tags: [content]
      summary: List published wiki articles
      operationId: listArticles
      responses:
        "200":
          description: Published articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [content]
      summary: Create a draft wiki article (admin only)
      operationId: createArticle
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArticleRequest"
      responses:
        "201":
          description: Draft article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/articles/{slug}:
    get:
      tags: [content]
      summary: Get a published wiki article by slug
      operationId: getArticleBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/artists:
    get:
      tags: [profile]
      summary: List approved artists
      operationId: listArtists
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 24, maximum: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Artist roster
          headers:
            X-Total-Count:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtistProfile"

  /api/v1/profiles/@{handle}:
    get:
      tags: [profile]
      summary: Get shareable profile by handle
      operationId: getProfileByHandle
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/artists/{slug}:
    get:
      tags: [profile]
      summary: Get artist profile by slug
      operationId: getArtistBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/institutions/{slug}:
    get:
      tags: [profile]
      summary: Get institution profile by slug
      operationId: getInstitutionBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Institution profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/artists/{slug}/posts:
    get:
      tags: [art]
      summary: List published artwork posts for an artist
      operationId: listArtistPosts
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Art posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtPost"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts/{id}:
    get:
      tags: [art]
      summary: Get artwork post by ID
      operationId: getPostByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Art post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/posts:
    get:
      tags: [art]
      summary: List published artwork posts
      operationId: listPosts
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: medium
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: style
          in: query
          schema: { type: string }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Art posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtPost"
    post:
      tags: [art]
      summary: Create a draft artwork post
      operationId: createPost
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtPostRequest"
      responses:
        "201":
          description: Draft art post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/artists:
    get:
      tags: [admin]
      summary: List artist profiles (admin)
      operationId: listArtistsAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, approved]
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Artist profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtistProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/v1/artists/{id}:
    get:
      tags: [admin]
      summary: Get artist profile (admin)
      operationId: getArtistAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Update artist status or featured flag
      operationId: patchArtistAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, pending, approved]
                featured: { type: boolean }
      responses:
        "200":
          description: Updated artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"

  /admin/v1/posts:
    get:
      tags: [admin]
      summary: List art posts (admin)
      operationId: listPostsAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Art posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtPost"

  /admin/v1/posts/{id}:
    get:
      tags: [admin]
      summary: Get art post (admin)
      operationId: getPostAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Art post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtPost"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Update art post status or featured acquisition
      operationId: patchPostAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, published, archived]
                featured_acquisition: { type: boolean }
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtPost"

  /admin/v1/articles:
    get:
      tags: [admin]
      summary: List wiki articles (admin)
      operationId: listArticlesAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Wiki articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Create a wiki article (admin)
      operationId: createArticleAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminArticleWriteRequest"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/v1/articles/{id}:
    get:
      tags: [admin]
      summary: Get wiki article by ID (admin)
      operationId: getArticleAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update wiki article content (admin)
      operationId: updateArticleAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminArticleWriteRequest"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Update wiki article status or verified flag
      operationId: patchArticleAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPatchArticleRequest"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/v1/applications:
    get:
      tags: [onboarding]
      summary: List pending onboarding applications
      operationId: listPendingApplications
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Pending applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingApplication"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/applications/{id}:
    get:
      tags: [onboarding]
      summary: Get onboarding application by ID
      operationId: getApplicationByID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Application found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [onboarding]
      summary: Review an onboarding application
      operationId: reviewApplication
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewApplicationRequest"
      responses:
        "200":
          description: Application reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/events:
    get:
      tags: [events]
      summary: List pending events awaiting review
      operationId: listPendingEvents
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Pending events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/events/sync:
    post:
      tags: [events]
      summary: Trigger event scraper sync
      operationId: syncEvents
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncEventsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/events/{id}:
    get:
      tags: [events]
      summary: Get event by ID for admin review
      operationId: getEventByID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [events]
      summary: Review an event
      operationId: reviewEvent
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewEventRequest"
      responses:
        "200":
          description: Event reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events:
    get:
      tags: [events]
      summary: List approved and pending events
      operationId: listEvents
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: upcoming
          in: query
          schema: { type: boolean, default: true }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /api/v1/events/submissions:
    post:
      tags: [events]
      summary: Submit a community event for review
      operationId: submitEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSubmissionRequest"
      responses:
        "201":
          description: Event submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limited

  /api/v1/events/{slug}:
    get:
      tags: [events]
      summary: Get approved or pending event by slug
      operationId: getEventBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/search:
    get:
      tags: [search]
      summary: Search published articles and approved events
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/applications:
    post:
      tags: [onboarding]
      summary: Submit an artist or institution onboarding application
      operationId: submitApplication
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationRequest"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/applications/me:
    get:
      tags: [onboarding]
      summary: Get the current user's latest onboarding application
      operationId: getMyApplication
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Latest application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/profile:
    get:
      tags: [profile]
      summary: Get the authenticated artist's profile
      operationId: getMyProfile
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Artist profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [profile]
      summary: Update the authenticated artist's profile
      operationId: updateMyProfile
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArtistProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "400":
