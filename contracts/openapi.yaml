          type: boolean

    ArtistProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        slug:
          type: string
        handle:
          type: string
        display_name:
          type: string
        bio:
          type: string
        born:
          type: string
        discipline:
          type: string
        tagline:
          type: string
        years_active:
          type: string
        portrait_url:
          type: string
        featured:
          type: boolean
        influences:
