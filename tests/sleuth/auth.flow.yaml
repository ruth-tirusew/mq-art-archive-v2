# yaml-language-server: $schema=https://raw.githubusercontent.com/ruth-tirusew/sleuth/0b7cdddea28bbce346d25c174f50c61e7b699ff0/sleuth/schema/flow.schema.json
version: 1
name: auth
description: >
  Register a new user, sign in, read the current user with the session, and check that the
  unhappy paths are refused. The session is an HttpOnly cookie, so the flow sends the
  Set-Cookie value back as a Cookie header (Sleuth has no cookie jar yet).
nodes:
  - id: register
    kind: request
    contract: api
    request:
      method: POST
      url: "{{ .env.base_url }}/api/v1/auth/register"
      body: {email: "{{ .env.test_email }}", password: "{{ .secrets.MQ_TEST_PASSWORD }}"}
  - id: registered
    kind: assertion
    assert:
      - {path: nodes.register.response.status, equals: 201}
      - {path: nodes.register.response.body.email, equals: "{{ .env.test_email }}"}
      - {path: nodes.register.response.body.role, equals: public}

  - id: login
    kind: request
    contract: api
    needs: [registered]
    request:
      method: POST
      url: "{{ .env.base_url }}/api/v1/auth/login"
      body: {email: "{{ .env.test_email }}", password: "{{ .secrets.MQ_TEST_PASSWORD }}"}
      extract: {cookie: headers.set-cookie}
  - id: logged_in
    kind: assertion
    assert:
      - {path: nodes.login.response.status, equals: 200}
      - {path: nodes.login.out.cookie, matches: '^mq_access_token=', message: the session cookie is set}

  - id: me
    kind: request
    contract: api
    needs: [logged_in]
    request:
      url: "{{ .env.base_url }}/api/v1/auth/me"
      headers: {Cookie: "{{ .nodes.login.out.cookie }}"}
  - id: me_ok
    kind: assertion
    assert:
      - {path: nodes.me.response.status, equals: 200}
      - {path: nodes.me.response.body.email, equals: "{{ .env.test_email }}"}

  - id: me_without_session
    kind: request
    contract: {source: api, on_violation: warn}
    request: {url: "{{ .env.base_url }}/api/v1/auth/me"}
  - id: wrong_password
    kind: request
    contract: {source: api, on_violation: warn}
    needs: [registered]
    request:
      method: POST
      url: "{{ .env.base_url }}/api/v1/auth/login"
      body: {email: "{{ .env.test_email }}", password: "definitely-not-the-password"}
  - id: duplicate_register
    kind: request
    contract: {source: api, on_violation: warn}
    needs: [registered]
    request:
      method: POST
      url: "{{ .env.base_url }}/api/v1/auth/register"
      body: {email: "{{ .env.test_email }}", password: "{{ .secrets.MQ_TEST_PASSWORD }}"}
  - id: refused
    kind: assertion
    assert:
      - {path: nodes.me_without_session.response.status, equals: 401}
      - {path: nodes.wrong_password.response.status, equals: 401}
      - {path: nodes.duplicate_register.response.status, equals: 409, message: an address can only register once}
