# Environment for the Sleuth API flows. Everything comes from the process environment:
#   MQ_BASE_URL       where the API listens, e.g. http://localhost:8080
#   MQ_TEST_EMAIL     an address for the test user the auth flow registers (must be new)
#   MQ_TEST_PASSWORD  its password (a secret: masked in all output)
vars:
  base_url: ${MQ_BASE_URL}
  test_email: ${MQ_TEST_EMAIL}
secrets: [MQ_TEST_PASSWORD]
contracts:
  api: ../../contracts/openapi.yaml
